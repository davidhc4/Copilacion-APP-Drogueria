name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Instalar Android SDK (cmdline-tools) manualmente
        run: |
          # Crear directorio para el SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          
          # Descargar las herramientas de línea de comandos (última versión estable)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          
          # Mover a la estructura esperada por Buildozer
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          
          # Crear un enlace simbólico para que Buildozer encuentre sdkmanager en la ruta antigua
          mkdir -p tools/bin
          ln -s ../cmdline-tools/latest/bin/sdkmanager tools/bin/sdkmanager
          ln -s ../cmdline-tools/latest/bin/avdmanager tools/bin/avdmanager
          
          # Aceptar todas las licencias automáticamente
          echo "yes" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Instalar las herramientas necesarias
          ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true

      - name: Compilar el APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"
          ANDROID_SDK_ROOT: ~/.buildozer/android/platform/android-sdk

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
