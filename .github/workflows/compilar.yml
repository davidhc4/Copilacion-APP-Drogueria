name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Configurar Buildozer y aceptar licencias automáticamente
        run: |
          # Inicializa Buildozer para que cree la estructura de carpetas
          buildozer init
          # Crea un script que responde "yes" a todas las licencias
          echo "#!/bin/bash" > accept_licenses.sh
          echo "yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true" >> accept_licenses.sh
          chmod +x accept_licenses.sh

      - name: Compilar el APK (con auto-aceptación de licencias)
        run: |
          # Esta variable de entorno obliga a Buildozer a aceptar licencias
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          # Compila, y si falla por licencias, las acepta y reintenta
          buildozer android debug || {
            echo "Reintentando después de aceptar licencias..."
            ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            echo "yes" | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
            export ANDROID_ACCEPT_SDK_LICENSE="yes"
            buildozer android debug
          }
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
