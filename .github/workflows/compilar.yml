name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Limpiar descargas anteriores de Buildozer
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          rm -rf ~/.buildozer/android/platform/apache-ant-*
          rm -rf ~/.buildozer/cache
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3

      - name: Instalar Android SDK y NDK con setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.0 ndk;28.0.13004108'

      - name: Configurar enlaces simbólicos para SDK y NDK
        run: |
          echo "🔍 Configurando enlaces simbólicos..."
          
          # 1. Crear estructura de carpetas para Buildozer
          mkdir -p ~/.buildozer/android/platform
          
          # 2. Enlazar SDK (ruta principal)
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          echo "✅ SDK enlazado"
          
          # 3. Enlazar NDK
          NDK_PATH=""
          if [ -d "/usr/local/lib/android/sdk/ndk/28.0.13004108" ]; then
            NDK_PATH="/usr/local/lib/android/sdk/ndk/28.0.13004108"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
          elif [ -d "/usr/local/lib/android/ndk" ]; then
            NDK_PATH="/usr/local/lib/android/ndk"
          fi
          
          if [ -n "$NDK_PATH" ]; then
            rm -rf ~/.buildozer/android/platform/android-ndk-r28c
            ln -sf $NDK_PATH ~/.buildozer/android/platform/android-ndk-r28c
            echo "✅ NDK enlazado desde: $NDK_PATH"
          else
            echo "❌ ERROR: No se encontró el NDK"
            exit 1
          fi
          
          # 4. Crear enlace para sdkmanager en la ruta antigua (tools/bin/)
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager /usr/local/lib/android/sdk/tools/bin/avdmanager
          echo "✅ Enlaces de sdkmanager creados en tools/bin/"

      - name: Aceptar licencias de Android
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses || true

      - name: Configurar Python 3.13 y limpiar caché
        run: |
          echo "P4A_PYTHON_VERSION=3.13" >> $GITHUB_ENV
          echo "PYTHON_VERSION=3.13" >> $GITHUB_ENV
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3
          echo "✅ Caché de Python limpiada, forzando Python 3.13"

      - name: Configurar entorno y compilar
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          export P4A_PYTHON_VERSION=3.13
          export PYTHON_VERSION=3.13
          
          # Verificar enlaces antes de compilar
          echo "📂 Verificando enlaces:"
          ls -la /usr/local/lib/android/sdk/tools/bin/
          ls -la ~/.buildozer/android/platform/
          
          echo "🚀 Iniciando compilación del APK..."
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
