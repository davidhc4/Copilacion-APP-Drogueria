name: Compilar APK Farmacenter

# Esto le dice a GitHub cuándo compilar:
# - Cada vez que subes cambios (push)
# - O manualmente con un botón (workflow_dispatch)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga tu código
      - name: Descargar el código
        uses: actions/checkout@v4

      # 2. Instala Python 3.11 (la versión correcta y estable)
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala las herramientas del sistema que Buildozer necesita
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      # 4. Instala Buildozer y Cython (versión compatible)
      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      # 5. Compila el APK (aquí ocurre la magia, tarda 20-40 min)
      - name: Compilar el APK
        run: |
          buildozer android debug
        env:
          # Acepta automáticamente las licencias del SDK de Android
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      # 6. Guarda el APK para que lo puedas descargar
      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
