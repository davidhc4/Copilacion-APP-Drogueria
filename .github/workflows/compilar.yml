name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Limpiar descargas anteriores de Buildozer
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          rm -rf ~/.buildozer/android/platform/apache-ant-*
          rm -rf ~/.buildozer/cache
          rm -rf ~/.buildozer/android/platform/python-for-android

      - name: Instalar Android SDK y NDK con setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.0 ndk;28.0.13004108'

      - name: Detectar ubicación del NDK y configurar enlaces
        run: |
          echo "🔍 Buscando NDK en el sistema..."
          
          # Buscar el NDK en posibles ubicaciones
          NDK_PATH=""
          
          # Opción 1: NDK instalado por setup-android en sdk/ndk/
          if [ -d "/usr/local/lib/android/sdk/ndk/28.0.13004108" ]; then
            NDK_PATH="/usr/local/lib/android/sdk/ndk/28.0.13004108"
            echo "✅ NDK encontrado en: $NDK_PATH"
          elif [ -d "/usr/local/lib/android/sdk/ndk/28.1.13004108" ]; then
            NDK_PATH="/usr/local/lib/android/sdk/ndk/28.1.13004108"
            echo "✅ NDK encontrado en: $NDK_PATH"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            # Tomar la primera carpeta que encuentre dentro de ndk/
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
            if [ -n "$NDK_PATH" ]; then
              echo "✅ NDK encontrado en: $NDK_PATH"
            fi
          elif [ -d "/usr/local/lib/android/ndk" ]; then
            NDK_PATH="/usr/local/lib/android/ndk"
            echo "✅ NDK encontrado en: $NDK_PATH"
          fi
          
          # Si no se encontró, instalar manualmente
          if [ -z "$NDK_PATH" ]; then
            echo "⚠️ No se encontró NDK, instalando manualmente..."
            mkdir -p /usr/local/lib/android/ndk
            cd /usr/local/lib/android/ndk
            wget -q https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            unzip -q android-ndk-r28c-linux.zip
            rm android-ndk-r28c-linux.zip
            if [ -d "android-ndk-r28c" ]; then
              mv android-ndk-r28c/* ./
              rm -rf android-ndk-r28c
            fi
            NDK_PATH="/usr/local/lib/android/ndk"
            echo "✅ NDK instalado manualmente en: $NDK_PATH"
          fi
          
          # Exportar variable para el siguiente paso
          echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV
          echo "✅ Configuración completada. NDK en: $NDK_PATH"

      - name: Aceptar licencias de Android
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses || true

      - name: Configurar entorno y compilar
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          export ANDROID_NDK_HOME=${{ env.NDK_PATH }}
          
          echo "📂 SDK en: $ANDROID_HOME"
          echo "📂 NDK en: $ANDROID_NDK_HOME"
          
          # Limpiar y crear enlaces simbólicos
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          mkdir -p ~/.buildozer/android/platform
          
          # Enlazar el SDK del sistema
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          
          # Enlazar el NDK encontrado
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            ln -sf $ANDROID_NDK_HOME ~/.buildozer/android/platform/android-ndk-r28c
            echo "✅ Enlace simbólico creado: ~/.buildozer/android/platform/android-ndk-r28c -> $ANDROID_NDK_HOME"
          else
            echo "❌ ERROR: NDK no encontrado en: $ANDROID_NDK_HOME"
            exit 1
          fi
          
          # Verificar que los enlaces funcionen
          echo "📂 Contenido de ~/.buildozer/android/platform/:"
          ls -la ~/.buildozer/android/platform/
          
          echo "🚀 Iniciando compilación del APK..."
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
