name: Compilar APK Farmacenterh

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Limpiar repositorios problemáticos de apt
        run: |
          sudo rm /etc/apt/sources.list.d/azure-cli.sources 2>/dev/null || true
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list 2>/dev/null || true
          sudo rm /etc/apt/sources.list.d/microsoft-ubuntu-repo.list 2>/dev/null || true
          echo "✅ Repositorios de Microsoft removidos"

      - name: Instalar dependencias del sistema
        run: |
          export APT_OPTION='--allow-insecure-repositories -o Acquire::AllowInsecureRepositories=true -o Acquire::AllowUnauthenticated=true'
          sudo apt-get update $APT_OPTION || true
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev || true

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Cache de Buildozer
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Limpiar descargas anteriores de Buildozer
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          rm -rf ~/.buildozer/android/platform/apache-ant-*
          rm -rf ~/.buildozer/cache
          rm -rf ~/.buildozer/android/platform/python-for-android
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a/build/other_builds/python3
          echo "✅ Caché limpiado"

      - name: Instalar Android SDK y NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.0 ndk;28.0.13004108'

      - name: Configurar enlaces simbólicos para SDK y NDK
        run: |
          echo "🔍 Configurando enlaces simbólicos..."
          
          mkdir -p ~/.buildozer/android/platform
          
          # SDK
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          echo "✅ SDK enlazado"
          
          # NDK
          NDK_PATH=""
          if [ -d "/usr/local/lib/android/sdk/ndk/28.0.13004108" ]; then
            NDK_PATH="/usr/local/lib/android/sdk/ndk/28.0.13004108"
          elif [ -d "/usr/local/lib/android/sdk/ndk" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1)
          fi
          
          if [ -n "$NDK_PATH" ]; then
            rm -rf ~/.buildozer/android/platform/android-ndk-r28c
            ln -sf $NDK_PATH ~/.buildozer/android/platform/android-ndk-r28c
            echo "✅ NDK enlazado desde: $NDK_PATH"
          else
            echo "❌ ERROR: NDK no encontrado"
            exit 1
          fi
          
          # sdkmanager
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager 2>/dev/null || true
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager /usr/local/lib/android/sdk/tools/bin/avdmanager 2>/dev/null || true
          echo "✅ Enlaces de herramientas creados"

      - name: Aceptar licencias de Android
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Compilar APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          export P4A_PYTHON_VERSION=3.11
          export PYTHON_VERSION=3.11
          
          echo "🚀 Iniciando compilación..."
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Mostrar resultado
        if: always()
        run: |
          if [ -f bin/*.apk ]; then
            echo "✅ APK compilado exitosamente:"
            ls -lh bin/*.apk
          else
            echo "⚠️ No se encontró el APK"
          fi
