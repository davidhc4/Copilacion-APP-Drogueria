name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Descargar y configurar Android SDK manualmente
        run: |
          # Crear directorio para el SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk
          cd ~/.buildozer/android/platform/android-sdk
          
          # Descargar command line tools (versión estable)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          
          # Configurar variables de entorno para el SDK
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/latest/bin
          
          # Aceptar TODAS las licencias automáticamente
          yes | ~/.buildozer/android/platform/android-sdk/latest/bin/sdkmanager --licenses || true
          
          # Instalar build-tools y plataformas necesarias
          ~/.buildozer/android/platform/android-sdk/latest/bin/sdkmanager "build-tools;37.0.0" "platforms;android-33" "platform-tools" --verbose || true

      - name: Compilar el APK
        run: |
          export ANDROID_SDK_ROOT=~/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/latest/bin
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          buildozer android debug
        env:
          ANDROID_SDK_ROOT: ~/.buildozer/android/platform/android-sdk
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
