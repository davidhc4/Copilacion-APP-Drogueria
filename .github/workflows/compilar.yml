name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Aceptar licencias de Android (SOLUCIÓN)
        run: |
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        continue-on-error: true

      - name: Compilar el APK
        run: |
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
