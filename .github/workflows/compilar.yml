name: Compilar APK Farmacenter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            automake build-essential ccache \
            libltdl-dev

      - name: Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Limpiar descargas anteriores de Buildozer
        run: |
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          rm -rf ~/.buildozer/android/platform/apache-ant-*
          rm -rf ~/.buildozer/cache
          rm -rf ~/.buildozer/android/platform/python-for-android

      - name: Instalar Android SDK y NDK con setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.0 ndk;28.0.13004108'

      - name: Verificar instalación del NDK
        run: |
          echo "NDK instalado en: /usr/local/lib/android/ndk"
          ls -la /usr/local/lib/android/ndk
          echo "Versión del NDK:"
          cat /usr/local/lib/android/ndk/source.properties || echo "No se encontró source.properties"

      - name: Aceptar licencias de Android
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager --licenses || true

      - name: Configurar entorno y compilar
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/ndk
          export ANDROID_ACCEPT_SDK_LICENSE="yes"
          
          # Limpiar y crear enlaces simbólicos
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          mkdir -p ~/.buildozer/android/platform
          
          # Enlazar el SDK del sistema
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          
          # Enlazar el NDK del sistema con el nombre que espera Buildozer
          ln -sf /usr/local/lib/android/ndk ~/.buildozer/android/platform/android-ndk-r28c
          
          # Verificar que los enlaces funcionen
          ls -la ~/.buildozer/android/platform/
          
          # Compilar
          buildozer android debug
        env:
          ANDROID_ACCEPT_SDK_LICENSE: "yes"

      - name: Subir el APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: PreciosFarmacenter-APK
          path: bin/*.apk
          if-no-files-found: error
